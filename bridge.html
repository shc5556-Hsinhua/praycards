<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>正在檢查舊的代禱卡…</title>
<style>
  html,body{margin:0;background:#F2F1E4;color:#4B514D;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  p{text-align:center;padding-top:40vh;margin:0}
</style>
<script>
/* 給新網站 praywall.pages.dev 用的「橋」：
   新網站第一次打開時會跳到這裡，讀這支手機（這個瀏覽器）裡舊的金香壇代禱卡名單與同步碼，
   再馬上跳回新網站（#old=1&n=名單&s=同步碼）。沒有名單時只帶 #old=1。這一頁不會改動任何資料。 */
(function(){
  var HOME = 'https://praywall.pages.dev/';
  function b64e(str){var b=new TextEncoder().encode(str),o='';for(var i=0;i<b.length;i++)o+=String.fromCharCode(b[i]);return btoa(o).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function hasNames(d){try{for(var i=0;i<d.days.length;i++){var n=d.days[i].names||[];for(var j=0;j<n.length;j++)if(String(n[j]||'').trim())return true;}}catch(e){}return false;}

  var back = HOME;
  try {
    var m = /[?&]back=([^&]*)/.exec(location.search);
    var b = m ? decodeURIComponent(m[1]) : '';
    if (b.indexOf(HOME) === 0) back = b;            // 只允許跳回新網站，避免被拿去轉到別的網站
  } catch(e) {}

  var parts = ['old=1'];
  try {
    var d = JSON.parse(localStorage.getItem('gia:names') || 'null');
    if (d && d.days && d.days.length === 7 && hasNames(d)) parts.push('n=' + b64e(JSON.stringify(d)));
  } catch(e) {}
  try {
    var code = String(localStorage.getItem('gia:sync') || '').trim();
    if (/^[A-Z2-9]{20}$/.test(code)) parts.push('s=' + code);
  } catch(e) {}

  location.replace(back.split('#')[0] + '#' + parts.join('&'));
})();
</script>
</head>
<body><p>正在檢查這支手機上舊的代禱卡…</p></body>
</html>
