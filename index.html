<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F2F1E4">
<link rel="canonical" href="https://praywall.pages.dev/">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>金香壇代禱卡 已搬到新網址</title>
<!-- 若 JavaScript 沒有執行，3 秒後仍會前往新網址 -->
<meta http-equiv="refresh" content="3; url=https://praywall.pages.dev/">
<style>
  html,body{margin:0;background:#F2F1E4;color:#2E322F;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  main{max-width:420px;margin:0 auto;padding:18vh 24px 40px;text-align:center}
  h1{font-size:22px;margin:0 0 10px}
  p{line-height:1.7;margin:8px 0;color:#4B514D}
  a.btn{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:999px;background:#A12A3C;color:#fff;text-decoration:none;font-weight:700}
  small{display:block;margin-top:28px;color:#8A8F88;font-size:12px;line-height:1.6}
  small a{color:#8A8F88}
</style>
<script>
(function(){
  /* ===== 只需要改這一行：新網址（若新網站放在子路徑，例如 https://praywall.pages.dev/praycards/，請連同結尾的斜線一起改） ===== */
  var TARGET = 'https://praywall.pages.dev/';

  function b64e(str){var b=new TextEncoder().encode(str),o='';for(var i=0;i<b.length;i++)o+=String.fromCharCode(b[i]);return btoa(o).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function hasNames(d){try{for(var i=0;i<d.days.length;i++){var n=d.days[i].names||[];for(var j=0;j<n.length;j++)if(String(n[j]||'').trim())return true;}}catch(e){}return false;}

  var url = TARGET;
  try{
    var q = location.search || '', h = location.hash || '';
    var again = /[?&]again=1(&|$)/.test(q);                 // …/praycards/?again=1 ＝ 強制再搬一次這支手機的名單
    if (again) { q = q.replace(/([?&])again=1(&|$)/, '$1').replace(/[?&]$/, ''); if (q === '?') q = ''; }

    var carry = false;
    if (!/[#&]n=/.test(h)) {                                  // 連結本身已帶名單（#n=…）就原樣轉過去，不另外搬
      var moved = null; try { moved = localStorage.getItem('gia:moved'); } catch(e) {}
      if (again || !moved) {
        var d = null, code = '';
        try { d = JSON.parse(localStorage.getItem('gia:names') || 'null'); } catch(e) {}
        try { code = String(localStorage.getItem('gia:sync') || '').trim(); } catch(e) {}
        var parts = [];
        if (d && d.days && d.days.length === 7 && hasNames(d)) parts.push('n=' + b64e(JSON.stringify(d)));
        if (/^[A-Z2-9]{20}$/.test(code)) parts.push('s=' + code);   // 新網站若支援 #s=，可直接接回雲端名單；不支援則會忽略
        if (parts.length) { h = '#' + parts.join('&'); carry = true; }
      }
    }
    url = TARGET + q + h;
    // 只在真的能連線時才記錄「已搬過」，離線失敗的話下次還會再搬一次
    if (carry && navigator.onLine !== false) { try { localStorage.setItem('gia:moved', String(Date.now())); } catch(e) {} }
  }catch(e){ url = TARGET; }

  try { var a = document.getElementById('go'); if (a) a.href = url; } catch(e) {}
  location.replace(url);
})();
</script>
</head>
<body>
<main>
  <h1>金香壇代禱卡搬家了</h1>
  <p>新網址：<br><strong>praywall.pages.dev</strong></p>
  <p>正在帶您前往新網址，第一次會把這支手機上的名單一起帶過去。<br>到了新網站之後，請重新「加入主畫面」。</p>
  <a class="btn" id="go" href="https://praywall.pages.dev/">前往新網址</a>
  <small>若新網站沒有看到名單：<a href="old.html">打開舊版代禱卡</a>，用「複製名單代碼」把名單搬過去；或請負責人提供 ?again=1 的連結。</small>
</main>
</body>
</html>
