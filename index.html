:root{--paper:#F2F1E4;--sheet:#FBFAF2;--ink:#2E322F;--muted:#767B73;--line:#A8ACA4;--pom:#A12A3C;--pom-deep:#6F1A28;--leaf:#8DB38A;--olive:#B6A359;--seed:#E7C9CD;
--sky:#4F7FA3;--olive-ink:#8A7A2E;--share-ink:#0B8F45;
--kai:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",serif;--sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#1D1A19;--sheet:#262220;--ink:#EDE9DF;--muted:#A6A198;--line:#4E4A46;--pom:#D55A6B;--pom-deep:#F2929E;--leaf:#7FA27C;--olive:#C9B66A;--seed:#4A2A30;--sky:#8FB5D6;--olive-ink:#C9B66A;--share-ink:#3DD374}}
:root[data-theme="dark"]{--paper:#1D1A19;--sheet:#262220;--ink:#EDE9DF;--muted:#A6A198;--line:#4E4A46;--pom:#D55A6B;--pom-deep:#F2929E;--leaf:#7FA27C;--olive:#C9B66A;--seed:#4A2A30;--sky:#8FB5D6;--olive-ink:#C9B66A;--share-ink:#3DD374}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero{height:clamp(200px,56vw,300px);border-radius:26px;overflow:hidden;margin-bottom:18px;background:#FBFAF2;border:1.5px solid var(--line);box-shadow:0 6px 18px rgba(60,20,25,.12)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:50% 43%;display:block}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top svg{width:44px;height:44px;flex:none}
.top h1{font-family:var(--kai);font-weight:700;font-size:1.5rem;letter-spacing:.12em;margin:0;line-height:1.2}
.top .date{margin:2px 0 0;color:var(--muted);font-size:.875rem;letter-spacing:.04em}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:16px}
.day{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:6px 0 5px;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0;position:relative;min-height:52px}
.day .wd{font-family:var(--kai);font-size:.95rem;line-height:1.3}
.day .ct{font-size:.68rem;color:var(--muted);line-height:1.3}
.day.today::after{content:"";position:absolute;top:-4px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--olive);border:2px solid var(--paper)}
.day.on{background:var(--pom);border-color:var(--pom);color:#fff}
.day.on .ct{color:rgba(255,255,255,.85)}
.day:focus-visible,.btn:focus-visible,.cell:focus-visible,.cell-in:focus-visible{outline:3px solid var(--olive);outline-offset:2px}
.card{background:var(--sheet);border:1.5px solid var(--line);border-radius:26px;padding:22px 18px 18px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;right:-26px;top:-26px;width:96px;height:96px;border-radius:50%;background:var(--pom);opacity:.12}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;position:relative}
.head .wd{font-size:.95rem;color:var(--muted);letter-spacing:.08em}
.head .tag{font-size:.75rem;color:var(--pom);border:1px solid var(--pom);border-radius:999px;padding:0 8px;margin-left:6px}
.head h2{font-family:var(--kai);font-weight:700;font-size:2.6rem;line-height:1.1;margin:4px 0 0;width:100%;letter-spacing:.14em;color:var(--pom-deep)}
.seeds{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0 4px;min-height:14px}
.seed{width:9px;height:13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--seed);transition:background .3s}
.seed.f{background:var(--pom)}
.count{margin:0 0 14px;color:var(--muted);font-size:.85rem}
.grid{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:18px;overflow:hidden}
.cell,.cell-in{appearance:none;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-family:var(--kai);font-size:1.15rem;min-height:54px;padding:8px 10px 8px 30px;text-align:left;position:relative;width:100%;border-radius:0}
.grid>:nth-child(2n){border-right:0}
.grid>:nth-last-child(-n+2){border-bottom:0}
.cell{cursor:pointer}
.cell::before{content:"";position:absolute;left:11px;top:50%;width:10px;height:14px;margin-top:-7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;border:1.5px solid var(--line)}
.cell.done::before{background:var(--pom);border-color:var(--pom)}
.cell.done{color:var(--muted)}
.cell:disabled{cursor:default}
.cell:disabled::before{border-style:dashed;opacity:.5}
.cell-in{background:var(--paper);outline:none}
.cell-in::placeholder{color:var(--line)}
.empty{margin:14px 2px 0;color:var(--muted);font-size:.9rem}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.btn{appearance:none;font:inherit;font-size:.95rem;border-radius:999px;padding:10px 18px;cursor:pointer;border:1.5px solid var(--pom);background:transparent;color:var(--pom);text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:44px}
.btn.solid{background:var(--pom);color:#fff}
.btn.line{border-color:#06C755;background:#06C755;color:#fff}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.edit{border-color:var(--pom);color:var(--pom)}
.btn.edit.solid{background:var(--pom);border-color:var(--pom);color:#fff}
.btn.share{border-color:#06C755;color:var(--share-ink)}
.btn.code{border-color:var(--olive);color:var(--olive-ink)}
.btn.code.solid{background:var(--olive);border-color:var(--olive);color:#fff}
.btn.sync{border-color:var(--sky);color:var(--sky)}
.btn.sync.solid{background:var(--sky);border-color:var(--sky);color:#fff}
.actions.tools{margin-top:8px}
.actions.tools .btn{font-size:.85rem;padding:7px 13px;min-height:38px}
.manual.import{background:var(--paper);min-height:120px}
.sync-line{margin:12px 2px 0;font-size:.85rem;color:var(--muted)}
.sync-line a{color:var(--sky)}
.sync{margin-top:10px;border:1px dashed var(--sky);border-radius:16px;padding:12px 14px;font-size:.9rem}
.sync-title{font-weight:700;margin:0 0 4px}
.sync-sub{margin:0;color:var(--muted);font-size:.82rem}
.sync .code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.05rem;letter-spacing:.05em;color:var(--pom-deep);margin:4px 0 6px;word-break:break-all;user-select:all}
.sync .hint{color:var(--muted);font-size:.82rem;margin:10px 0 0;line-height:1.6}
.sync .actions{margin-top:6px}
.status{min-height:1.4em;margin:10px 2px 0;font-size:.875rem;color:var(--muted)}
.manual{width:100%;min-height:180px;margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:.9rem;background:var(--sheet);color:var(--ink)}
.verse{margin:26px 4px 0;font-family:var(--kai);color:var(--muted);font-size:1rem;line-height:1.9;letter-spacing:.05em;border-left:3px solid var(--olive);padding-left:12px}
.verse cite{display:block;font-style:normal;font-size:.85rem}
@media (prefers-reduced-motion:reduce){.seed{transition:none}}

function listText(){var d=data.days[sel];var ns=d.names.map(function(s){return s.trim();}).filter(Boolean);

function render(){

var m=(marks[sel]||[]).filter(function(i){return names[i]&&names[i].trim();});
var h='<div class="wrap"><h1 class="sr-only">金香壇代禱卡</h1><header class="hero"><img src="'+HERO+'" alt="金香壇代禱卡"></header>';
h+='<nav class="days" role="tablist" aria-label="選擇代禱日">';
data.days.forEach(function(x,i){h+='<button role="tab" aria-selected="'+(i===sel)+'" class="day'+(i===sel?' on':'')+(i===todayIdx?' today':'')+'" data-day="'+i+'"><span class="wd">'+(i===0?'主日':WD[i])+'</span><span class="ct">'+esc(x.cat.replace(/[（(].*[)）]/,''))+'</span></button>';});
h+='</nav><section class="card"><div class="head"><span class="wd">'+lbl(sel)+(sel===todayIdx?'<span class="tag">今天</span>':'')+'</span><h2>'+esc(d.cat)+'</h2></div>';
if(!editing&&filled){h+='<div class="seeds" aria-hidden="true">';for(var s=0;s<filled;s++)h+='<span class="seed'+(s<m.length?' f':'')+'"></span>';h+='</div><p class="count">已代禱 '+m.length+' / '+filled+'　點名字標記</p>';}
else if(editing){h+='<p class="count" style="margin-top:14px">輸入名字或暱稱，空白格可留空</p>';}
else{h+='<div style="height:14px"></div>';}
h+='<div class="grid">';
names.forEach(function(n,i){
if(editing)h+='<input class="cell-in" data-slot="'+i+'" value="'+esc(n)+'" maxlength="20" placeholder="'+(i+1)+'" aria-label="第'+(i+1)+'格">';
else{var t=n.trim(),done=m.indexOf(i)>-1;h+='<button class="cell'+(done?' done':'')+'" data-slot="'+i+'"'+(t?' aria-pressed="'+done+'"':' disabled aria-label="空白"')+'>'+esc(t)+'</button>';}
});
h+='</div>';
if(!editing&&!filled)h+='<p class="empty">這一天的名單是空的，點「編輯名單」加入名字。</p>';

h+='</div><div class="actions tools"><button class="btn code" data-act="code">複製名單代碼</button><button class="btn code" data-act="import">匯入名單</button>';
