(function(){

function b64e(str){var b=new TextEncoder().encode(str),o='';for(var i=0;i<b.length;i++)o+=String.fromCharCode(b[i]);return btoa(o).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}

else{var t=n.trim(),done=m.indexOf(i)>-1;h+='<button class="cell'+(done?' done':'')+'" data-slot="'+i+'"'+(t?' aria-pressed="'+done+'"':' disabled aria-label="空白"')+'>'+esc(t)+'</button>';}

function readInputs(){var a=[];app.querySelectorAll('.cell-in').forEach(function(inp){a[+inp.dataset.slot]=inp.value;});return a;}
